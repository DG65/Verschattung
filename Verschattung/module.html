<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kachel der Verschattung (HTML-SDK) und eigenständige Seite für IPSView (WebHook).
     Stil wie die übrigen NRG-Stack-Kacheln: Karten, ruhige Typografie, klare Zahlen, keine Illustration.
     Aufbau: Lage-Karte mit Kennzahlen · Sonnenstandsdiagramm (polar, Norden oben: Horizont und Nachbarn als Silhouette,
     Sichtbereich der Fassade, Sonnenbahn heute, Sonne jetzt, Hausumriss) · Tagesverlauf · Behänge je Fassade als Karten. -->
<style>
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#aeaeb2;--linie:rgba(0,0,0,.08);--karte:rgba(255,255,255,.72);--karte2:rgba(0,0,0,.035);
  --schatten:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--sonne:#f5a623;--sonneT:rgba(245,166,35,.14);
  --kuehl:#0a84ff;--heiz:#ff7a1a;--warn:#ff3b30;--gruen:#34c759;--sil:#c7c7cc;--sil2:#a1a1a6;--haus:#3a3a3c}
@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--fg2:#98989d;--fg3:#5a5a5e;--linie:rgba(255,255,255,.09);--karte:rgba(44,44,46,.72);--karte2:rgba(255,255,255,.05);
  --schatten:0 1px 2px rgba(0,0,0,.3);--sil:#48484a;--sil2:#636366;--haus:#e5e5ea}}
body.hell{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#aeaeb2;--linie:rgba(0,0,0,.08);--karte:rgba(255,255,255,.72);--karte2:rgba(0,0,0,.035);--schatten:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--sil:#c7c7cc;--sil2:#a1a1a6;--haus:#3a3a3c}
body.dunkel{--fg:#f5f5f7;--fg2:#98989d;--fg3:#5a5a5e;--linie:rgba(255,255,255,.09);--karte:rgba(44,44,46,.72);--karte2:rgba(255,255,255,.05);--schatten:0 1px 2px rgba(0,0,0,.3);--sil:#48484a;--sil2:#636366;--haus:#e5e5ea}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{box-sizing:border-box;padding:var(--margin-top,14px) var(--margin-side,14px) var(--margin-bottom,14px)}
.kachel{box-sizing:border-box;height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.kachel>*{flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer}
.karte{background:var(--karte);border-radius:16px;box-shadow:var(--schatten);padding:14px 16px}
.titel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.titel .rechts{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.zahl{font-variant-numeric:tabular-nums}
/* Oben: Lage + Diagramm */
.oben{display:grid;grid-template-columns:minmax(240px,1fr) minmax(240px,1.1fr);gap:12px;align-items:start}
@media (max-width:620px){.oben{grid-template-columns:1fr}}
.links{display:flex;flex-direction:column;gap:12px}
.lage{display:flex;flex-direction:column;gap:14px}
/* Sonnenwärme */
.waerme .paar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.waerme .paar div{background:var(--karte2);border-radius:12px;padding:9px 11px}
.waerme .paar b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.waerme .paar span{font-size:11px;color:var(--fg2)}
.waerme .rein b{color:var(--heiz)} .waerme .ab b{color:var(--kuehl)}
.waerme .balken{height:6px;border-radius:3px;background:var(--karte2);margin:12px 0 6px;overflow:hidden;display:flex}
.waerme .balken i{display:block;height:100%}
.waerme .klein{font-size:11px;color:var(--fg2);line-height:1.4}
.zeile.vorschau .wert{font-weight:400;color:var(--fg2)}
.lage .haupt{font-size:24px;font-weight:600;line-height:1.15}
.lage .haupt.kuehlen{color:var(--kuehl)} .lage .haupt.heizen{color:var(--heiz)}
.lage .unter{font-size:13px;color:var(--fg2);margin-top:3px}
.kz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kz div{background:var(--karte2);border-radius:12px;padding:9px 11px}
.kz b{display:block;font-size:20px;font-weight:600;line-height:1.1}
.kz span{font-size:11px;color:var(--fg2)}
.zeile{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.zeile .wert{color:var(--fg);font-weight:500}
.schalter{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2)}
.toggle{width:44px;height:26px;border-radius:13px;border:0;background:var(--fg3);position:relative;padding:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.toggle.an{background:var(--gruen)} .toggle.an::after{left:20px}
.toggle:disabled{opacity:.5;cursor:default}
.toggle.klein{width:34px;height:20px;border-radius:10px} .toggle.klein::after{width:16px;height:16px} .toggle.klein.an::after{left:16px}
.hinweis{background:rgba(255,59,48,.12);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
.diagramm{display:flex;flex-direction:column;align-items:center}
.diagramm svg{display:block;width:100%;max-width:340px;height:auto}
.chip{font-size:11px;color:var(--fg2);background:var(--karte2);border:0;border-radius:10px;padding:3px 9px}
.legende{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--fg2);margin-top:4px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Tagesverlauf */
.verlauf svg{display:block}
/* Behänge */
.gruppe{display:flex;flex-direction:column;gap:8px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.geraet{background:var(--karte);box-shadow:var(--schatten);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1.5px solid transparent;min-height:112px}
.geraet.gewaehlt{border-color:var(--sonne)}
.geraet.aus{opacity:.5}
.geraet .k{display:flex;align-items:flex-start;gap:8px}
.geraet .sym{flex:none;width:34px;height:34px}
.geraet .n{font-size:14px;font-weight:600;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.geraet .s{font-size:13px;font-weight:500}
.geraet .g{font-size:12px;color:var(--fg2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.geraet .m{display:flex;gap:10px;font-size:11px;color:var(--fg2);margin-top:auto}
.weg{grid-column:1/-1;background:var(--karte2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--fg2);white-space:pre-line;line-height:1.55}
.info{background:var(--karte2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--fg2);white-space:pre-line;line-height:1.55}
.infoknopf{background:none;border:0;padding:0;font-size:12px;color:var(--fg2);text-align:left}
</style>
</head>
<body>
<div class="kachel" id="kachel"></div>
<script>
var daten = null, gewaehlt = null, fassadeWahl = null, infoOffen = false, nachbarnAn = true;
try { nachbarnAn = localStorage.getItem('vsch-nachbarn') !== '0'; } catch (e) { }

function T(k) { return (daten && daten.texte && daten.texte[k]) || k; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function zahl(v, n) { return v == null ? '–' : Number(v).toLocaleString(undefined, {minimumFractionDigits: n || 0, maximumFractionDigits: n || 0}); }
function uhr(ts) { var d = new Date(ts * 1000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function aktion(ident, wert) { if (typeof requestAction === 'function') { requestAction(ident, wert); } }
function f1(v) { return v.toFixed(1); }

// ------------------------------------------------ Sonnenstandsdiagramm (polar, Norden oben)
function sonnenDiagramm(fa) {
  var S = 300, c = S / 2, R = 128, o = '';
  function rad(alt) { return R * (90 - Math.max(0, Math.min(90, alt))) / 90; }
  function P(az, alt) { var a = az * Math.PI / 180, r = rad(alt); return [c + Math.sin(a) * r, c - Math.cos(a) * r]; }
  // Sichtbereich der Fassade (±80°): weicher Sektor
  if (fa) {
    var a0 = (fa.az - 80) * Math.PI / 180, a1 = (fa.az + 80) * Math.PI / 180;
    o += '<path d="M' + c + ',' + c + ' L' + f1(c + Math.sin(a0) * R) + ',' + f1(c - Math.cos(a0) * R) + ' A' + R + ',' + R + ' 0 0,1 ' + f1(c + Math.sin(a1) * R) + ',' + f1(c - Math.cos(a1) * R) + 'z" fill="var(--sonneT)"/>';
  }
  // Ringe 0/30/60° und Himmelsrichtungen
  [0, 30, 60].forEach(function (h) { o += '<circle cx="' + c + '" cy="' + c + '" r="' + f1(rad(h)) + '" fill="none" stroke="var(--linie)"/>'; });
  [0, 45, 90, 135, 180, 225, 270, 315].forEach(function (az) { var p = P(az, 0); o += '<line x1="' + c + '" y1="' + c + '" x2="' + f1(p[0]) + '" y2="' + f1(p[1]) + '" stroke="var(--linie)"/>'; });
  [[0, 'N'], [90, T('E')], [180, 'S'], [270, 'W']].forEach(function (t) { var a = t[0] * Math.PI / 180; o += '<text x="' + f1(c + Math.sin(a) * (R + 12)) + '" y="' + f1(c - Math.cos(a) * (R + 12) + 4) + '" font-size="11" font-weight="600" text-anchor="middle" fill="var(--fg2)">' + t[1] + '</text>'; });
  [30, 60].forEach(function (h) { o += '<text x="' + (c + 3) + '" y="' + f1(c - rad(h) - 3) + '" font-size="9" fill="var(--fg3)">' + h + '°</text>'; });
  // Horizont (Gelände) und Nachbargebäude als Silhouette vom Rand nach innen
  var hz = {}; (daten.horizont || []).forEach(function (p) { hz[p[0]] = p[1]; });
  var geb = {}; if (fa && nachbarnAn) { (fa.gebaeude || []).forEach(function (p) { geb[p[0]] = p[1]; }); }
  function silhouette(mitGeb) {
    var d = '';
    for (var az = 0; az <= 360; az += 3) {
      var g = hz[az - az % 5] || 0; if (mitGeb) { g = Math.max(g, geb[az % 360] || 0); }
      var p = P(az % 360, g); d += (az ? ' L' : 'M') + f1(p[0]) + ',' + f1(p[1]);
    }
    return 'M' + (c - R) + ',' + c + ' A' + R + ',' + R + ' 0 1,1 ' + (c + R) + ',' + c + ' A' + R + ',' + R + ' 0 1,1 ' + (c - R) + ',' + c + 'z ' + d + 'z';
  }
  if (nachbarnAn && fa && (fa.gebaeude || []).length) { o += '<path d="' + silhouette(true) + '" fill="var(--sil2)" fill-rule="evenodd" opacity=".55"/>'; }
  o += '<path d="' + silhouette(false) + '" fill="var(--sil)" fill-rule="evenodd"/>';
  // Hausumriss in der Mitte (maßstäblich verkleinert)
  if ((daten.haus || []).length) {
    var ext = 6; daten.haus.forEach(function (p) { ext = Math.max(ext, Math.abs(p[0]), Math.abs(p[1])); });
    var m = 26 / ext, pts = daten.haus.map(function (p) { return f1(c + p[0] * m) + ',' + f1(c - p[1] * m); }).join(' ');
    o += '<polygon points="' + pts + '" fill="var(--karte)" stroke="var(--haus)" stroke-width="1.4"/>';
    if (fa && fa.seg) { fa.seg.forEach(function (s) { o += '<line x1="' + f1(c + s[0][0] * m) + '" y1="' + f1(c - s[0][1] * m) + '" x2="' + f1(c + s[1][0] * m) + '" y2="' + f1(c - s[1][1] * m) + '" stroke="var(--sonne)" stroke-width="3" stroke-linecap="round"/>'; }); }
  }
  // Sonnenbahn heute: auf der Fassade kräftig, sonst gestrichelt
  var bahn = (daten.bahn || []).filter(function (p) { return p[1] > 0; }), zeiten = (fa && fa.zeiten) || [];
  function an(ts) { return zeiten.some(function (z) { return ts >= z[0] && ts <= z[1]; }); }
  var d0 = '', seg = [], segs = [];
  bahn.forEach(function (p, i) { var q = P(p[0], p[1]); d0 += (i ? ' L' : 'M') + f1(q[0]) + ',' + f1(q[1]); if (an(p[2])) { seg.push(q); } else if (seg.length) { segs.push(seg); seg = []; } });
  if (seg.length) { segs.push(seg); }
  if (d0) { o += '<path d="' + d0 + '" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>'; }
  segs.forEach(function (sg) { o += '<polyline points="' + sg.map(function (q) { return f1(q[0]) + ',' + f1(q[1]); }).join(' ') + '" fill="none" stroke="var(--sonne)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'; });
  // volle Stunden als kleine Punkte mit Zahl
  bahn.forEach(function (p) { var d = new Date(p[2] * 1000); if (d.getMinutes() === 0 && d.getHours() % 3 === 0) { var q = P(p[0], p[1]); o += '<circle cx="' + f1(q[0]) + '" cy="' + f1(q[1]) + '" r="2" fill="var(--fg2)"/><text x="' + f1(q[0]) + '" y="' + f1(q[1] - 6) + '" font-size="9" text-anchor="middle" fill="var(--fg2)">' + d.getHours() + '</text>'; } });
  // Sonne jetzt
  if (daten.sonne && daten.sonne.alt > 0) { var q = P(daten.sonne.az, daten.sonne.alt); o += '<circle cx="' + f1(q[0]) + '" cy="' + f1(q[1]) + '" r="11" fill="#ffcc00" opacity=".25"/><circle cx="' + f1(q[0]) + '" cy="' + f1(q[1]) + '" r="6.5" fill="#ffcc00" stroke="#fff" stroke-width="1.5"/>'; }
  return '<svg viewBox="0 0 ' + S + ' ' + S + '">' + o + '</svg>';
}

// ------------------------------------------------ Tagesverlauf
function tagesverlauf(fa, B) {
  var t = daten.tag; if (!t) { return ''; }
  var t0 = t.auf - 1800, t1 = t.unter + 1800, W = Math.max(280, B - 34), H = 104, mt = 16, mb = 20, maxW = 100;
  (t.klar || []).forEach(function (p) { maxW = Math.max(maxW, p[1]); });
  (t.verlauf || []).forEach(function (p) { if (p[1] != null) { maxW = Math.max(maxW, p[1]); } });
  maxW = Math.ceil(maxW / 200) * 200;
  function x(ts) { return (ts - t0) / (t1 - t0) * W; }
  function y(v) { return H - mb - v / maxW * (H - mt - mb); }
  var o = '<defs><linearGradient id="ev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5a623" stop-opacity=".45"/><stop offset="1" stop-color="#f5a623" stop-opacity=".03"/></linearGradient></defs>';
  [0, .5, 1].forEach(function (f) { o += '<line x1="0" y1="' + f1(y(maxW * f)) + '" x2="' + W + '" y2="' + f1(y(maxW * f)) + '" stroke="var(--linie)"/>'; });
  o += '<text x="' + W + '" y="' + f1(y(maxW) - 4) + '" font-size="9" text-anchor="end" fill="var(--fg3)">' + maxW + ' W/m²</text>';
  ((fa && fa.zeiten) || []).forEach(function (z) {
    o += '<rect x="' + f1(x(z[0])) + '" y="2" width="' + f1(x(z[1]) - x(z[0])) + '" height="6" rx="3" fill="var(--sonne)"/>';
  });
  // erwartet (Vorschau): gestrichelt unter der Sonnenzeit – blau = Beschattung, orange = Sonne heizt mit
  var farbeV = daten.lage === 'kuehlen' ? 'var(--kuehl)' : 'var(--heiz)';
  ((daten.vorschau && daten.vorschau.zeiten) || []).forEach(function (e) {
    if (fa && e[0] !== fa.kennung) { return; }
    o += '<line x1="' + f1(x(e[2])) + '" y1="11" x2="' + f1(x(e[3])) + '" y2="11" stroke="' + farbeV + '" stroke-width="2" stroke-dasharray="4 3"/>';
  });
  var d = ''; (t.klar || []).forEach(function (p, i) { d += (i ? ' L' : 'M') + f1(x(p[0])) + ',' + f1(y(p[1])); });
  if (d) { o += '<path d="' + d + '" fill="none" stroke="var(--fg3)" stroke-width="1.2" stroke-dasharray="3 3"/>'; }
  var m = '', erst = null, letzt = null;
  (t.verlauf || []).forEach(function (p) { if (p[1] == null || p[0] < t0) { return; } m += (erst == null ? 'M' : ' L') + f1(x(p[0])) + ',' + f1(y(p[1])); if (erst == null) { erst = p[0]; } letzt = p[0]; });
  if (m) { o += '<path d="' + m + ' L' + f1(x(letzt)) + ',' + f1(y(0)) + ' L' + f1(x(erst)) + ',' + f1(y(0)) + 'z" fill="url(#ev)"/><path d="' + m + '" fill="none" stroke="#f5a623" stroke-width="2" stroke-linejoin="round"/>'; }
  (t.verlauf || []).forEach(function (p) { if (p[2] > 0 && p[0] >= t0) { o += '<rect x="' + f1(x(p[0])) + '" y="' + f1(H - mb + 3) + '" width="' + f1(Math.max(1, x(p[0] + 600) - x(p[0]))) + '" height="4" fill="var(--kuehl)"/>'; } });
  for (var h = Math.ceil(t0 / 3600) * 3600; h <= t1; h += 3600) { var hh = new Date(h * 1000).getHours(); if (hh % 3 === 0) { o += '<text x="' + f1(x(h)) + '" y="' + (H - 3) + '" font-size="10" text-anchor="middle" fill="var(--fg2)">' + hh + ':00</text>'; } }
  if (daten.jetzt >= t0 && daten.jetzt <= t1) { o += '<line x1="' + f1(x(daten.jetzt)) + '" y1="' + mt + '" x2="' + f1(x(daten.jetzt)) + '" y2="' + (H - mb + 7) + '" stroke="var(--fg)" stroke-width="1.2"/>'; }
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + o + '</svg>';
}

// ------------------------------------------------ Behang-Symbol (Füllstand wie Apple Home)
function symbol(g) {
  var z = Math.max(0, Math.min(1, g.zu == null ? 0 : g.zu)), o = '<rect x="1" y="1" width="32" height="32" rx="9" fill="var(--karte2)"/>';
  var farbe = g.aktiv === false ? 'var(--fg3)' : (z > .02 ? 'var(--fg)' : 'var(--fg3)');
  if (g.typ === 'markise') {
    o += '<line x1="7" y1="10" x2="27" y2="10" stroke="' + farbe + '" stroke-width="2" stroke-linecap="round"/>';
    o += '<path d="M7,10 L' + f1(7 - z * 3) + ',' + f1(10 + 4 + z * 12) + ' L' + f1(27 + z * 3) + ',' + f1(10 + 4 + z * 12) + ' L27,10z" fill="' + farbe + '" opacity="' + (.25 + z * .55) + '"/>';
    return '<svg class="sym" viewBox="0 0 34 34">' + o + '</svg>';
  }
  o += '<line x1="7" y1="8" x2="27" y2="8" stroke="' + farbe + '" stroke-width="2" stroke-linecap="round"/>';
  var unten = 8 + z * 19;
  if (g.typ === 'raffstore' && g.lamelle != null) {
    var w = Math.min(75, g.lamelle) * Math.PI / 180;
    for (var yy = 11; yy <= unten; yy += 3.2) { o += '<line x1="' + f1(17 - 9 * Math.cos(w * .3)) + '" y1="' + f1(yy - 1.4 * Math.sin(w)) + '" x2="' + f1(17 + 9 * Math.cos(w * .3)) + '" y2="' + f1(yy + 1.4 * Math.sin(w)) + '" stroke="' + farbe + '" stroke-width="1.6" stroke-linecap="round"/>'; }
  } else if (z > .02) {
    o += '<rect x="8" y="9" width="18" height="' + f1(unten - 9) + '" rx="1.5" fill="' + farbe + '" opacity=".85"/>';
  }
  return '<svg class="sym" viewBox="0 0 34 34">' + o + '</svg>';
}

// ------------------------------------------------ Vorschau (Idee 3): wann heute noch kräftige Sonne auf welche Fassade kommt
function vorschauText() {
  var v = daten.vorschau; if (!v || daten.sperre) { return ''; }
  var z = v.zeiten || [];
  if (!z.length) { return daten.sonne && daten.sonne.alt > 0 ? T('No strong sun expected today any more') : ''; }
  var teile = z.map(function (e) { return (e[1] || e[0]) + ' ' + uhr(e[2]) + '–' + uhr(e[3]); }).join(', ');
  var s = daten.lage === 'kuehlen' ? T('Expected today: shading %s') : (daten.lage === 'heizen' ? T('Expected today: sun on %s – the devices stay up, the sun heats with us') : T('Expected today: sun on %s'));
  return s.replace('%s', teile) + (v.basis === 'clearSky' ? ' (' + T('if the sky is clear') + ')' : '');
}
function vorschauZeile() { var t = vorschauText(); return t ? '<div class="zeile vorschau">◷ <span class="wert">' + esc(t) + '</span></div>' : ''; }

// ------------------------------------------------ Sonnenwärme: was die Sonne heute ins Haus bringt und was die Behänge abhalten
function kwh(wh) { return zahl(wh / 1000, wh >= 10000 ? 0 : 1); }
function waermeKarte() {
  var w = daten.waerme; if (!w) { return ''; }
  var reinZuerst = daten.lage !== 'kuehlen';
  var rein = '<div class="rein"><b class="zahl">' + kwh(w.heute) + ' kWh</b><span>' + esc(T('into the house')) + '</span></div>';
  var ab = '<div class="ab"><b class="zahl">' + kwh(w.ab) + ' kWh</b><span>' + esc(T('kept out')) + '</span></div>';
  var o = '<div class="karte waerme"><div class="titel">' + esc(T('Solar heat today')) + (w.geschaetzt ? '<span class="rechts chip" title="' + esc(T('Window area not entered – 2 m² assumed per device')) + '">' + esc(T('estimated')) + '</span>' : '') + '</div>'
    + '<div class="paar">' + (reinZuerst ? rein + ab : ab + rein) + '</div>';
  var max = Math.max(w.klar || 0, w.heute + w.ab);
  if (max > 0) {
    var bR = '<i style="width:' + f1(w.heute / max * 100) + '%;background:var(--heiz)"></i>', bA = '<i style="width:' + f1(w.ab / max * 100) + '%;background:var(--kuehl)"></i>';
    o += '<div class="balken">' + (reinZuerst ? bR + bA : bA + bR) + '</div>'
      + '<div class="klein">' + esc(T('Clear sky with all devices open: about %s kWh today').replace('%s', kwh(w.klar || 0))) + '</div>';
  }
  var z = [];
  if (w.jetzt != null && (w.jetzt > 0 || w.jetztAb > 0)) { z.push(T('now') + ' <span class="wert zahl">' + zahl(w.jetzt) + ' W</span>' + (w.jetztAb > 0 ? ' · ' + esc(T('kept out')) + ' <span class="wert zahl">' + zahl(w.jetztAb) + ' W</span>' : '')); }
  if (w.gestern) { var gR = '<span class="wert zahl" style="color:var(--heiz)">' + kwh(w.gestern.rein) + '</span>', gA = '<span class="wert zahl" style="color:var(--kuehl)">' + kwh(w.gestern.ab) + '</span>'; z.push(T('yesterday') + ' ' + (reinZuerst ? gR + ' / ' + gA : gA + ' / ' + gR) + ' kWh'); }
  if (z.length) { o += '<div class="zeile" style="margin-top:8px;flex-wrap:wrap">' + z.join('<span style="margin:0 2px">·</span>') + '</div>'; }
  return o + '</div>';
}

// ------------------------------------------------ Aufbau
function zeichnen() {
  var k = document.getElementById('kachel'); if (!daten) { return; }
  var B = Math.max(300, (k.clientWidth || 600) - 2);
  var geraete = (daten.geraete || []).map(function (g, i) { g._i = i; return g; });
  var fassaden = (daten.fassaden || []).filter(function (f) { return geraete.some(function (g) { return g.fassade === f.kennung; }); });
  if (fassadeWahl == null || !fassaden.some(function (f) { return f.kennung === fassadeWahl; })) {
    var best = null; fassaden.forEach(function (f) { var n = geraete.filter(function (g) { return g.fassade === f.kennung; }).length; if (!best || n > best.n) { best = {k: f.kennung, n: n}; } });
    fassadeWahl = best ? best.k : null;
  }
  var fa = fassaden.filter(function (f) { return f.kennung === fassadeWahl; })[0] || null;
  var o = '';
  if (daten.sperre) { o += '<div class="hinweis">' + esc(daten.sperre) + '</div>'; }
  var gestoert = geraete.filter(function (g) { return g.stoerung; });
  if (gestoert.length) { o += '<div class="hinweis">⚠ ' + esc(gestoert.length === 1 ? T('One device does not reach its target') : T('%d devices do not reach their target').replace('%d', gestoert.length)) + '</div>'; }
  // Lage + Diagramm
  var anJetzt = fassaden.filter(function (f) { return f.sonne; }).map(function (f) { return f.name; });
  o += '<div class="oben"><div class="links"><div class="karte lage"><div><div class="titel">' + esc(T('Shading')) + '<span class="rechts schalter">' + esc(T('Automatic'))
    + ' <button class="toggle' + (daten.automatik ? ' an' : '') + '" id="auto"' + (daten.bedienbar ? '' : ' disabled') + '></button></span></div>'
    + '<div class="haupt ' + esc(daten.lage || '') + '">' + esc(daten.lageText || T('Shading')) + '</div>'
    + '<div class="unter">' + esc(anJetzt.length ? T('Sun on') + ' ' + anJetzt.join(', ') : T('No sun on the facades')) + (daten.wp ? ' · ' + esc(T('Heat pump') + ': ' + daten.wp) : '') + '</div></div>';
  o += '<div class="kz"><div><b class="zahl">' + zahl(daten.einstrahlung) + '</b><span>W/m² · ' + esc(T((daten.himmel || {}).text || 'Irradiance')) + '</span></div>'
    + '<div><b class="zahl">' + zahl(daten.aussen, 1) + '°</b><span>' + esc(T('outside')) + '</span></div>'
    + '<div><b class="zahl">' + (daten.sonne && daten.sonne.alt > 0 ? zahl(daten.sonne.alt) + '°' : '–') + '</b><span>' + esc(T('sun height')) + '</span></div></div>';
  var t = daten.tag || {};
  o += '<div class="zeile">☀︎ <span class="wert">' + (t.auf ? uhr(t.auf) : '–') + '</span> – <span class="wert">' + (t.unter ? uhr(t.unter) : '–') + '</span>'
    + (fa ? '<span style="margin-left:auto">' + esc(fa.name) + ': <span class="wert">' + esc((fa.zeiten || []).map(function (z) { return uhr(z[0]) + '–' + uhr(z[1]); }).join(', ') || T('none')) + '</span></span>' : '') + '</div>'
    + vorschauZeile() + '</div>';
  o += waermeKarte() + '</div>';
  o += '<div class="karte diagramm"><div class="titel" style="align-self:stretch">' + esc(T('Sun path today')) + '<span class="rechts">'
    + ((fa && (fa.gebaeude || []).length) ? '<button class="chip" id="nachbarn">' + esc(nachbarnAn ? T('Neighbours on') : T('Neighbours off')) + '</button>' : '') + '</span></div>'
    + sonnenDiagramm(fa)
    + '<div class="legende"><span><i style="background:var(--sonne)"></i>' + esc(T('sun on the facade')) + '</span><span><i style="background:var(--sil)"></i>' + esc(T('terrain')) + '</span>'
    + (fa && (fa.gebaeude || []).length && nachbarnAn ? '<span><i style="background:var(--sil2);opacity:.55"></i>' + esc(T('neighbouring buildings')) + '</span>' : '') + '</div></div></div>';
  // Tagesverlauf
  o += '<div class="karte verlauf"><div class="titel">' + esc(T('Today')) + '<span class="rechts"><span style="color:var(--sonne)">▬</span> ' + esc(T('sun on the facade')) + ' &nbsp; <span style="color:' + (daten.lage === 'kuehlen' ? 'var(--kuehl)' : 'var(--heiz)') + '">┅</span> ' + esc(T('expected')) + ' &nbsp; <span style="color:var(--kuehl)">▬</span> ' + esc(T('shaded')) + '</span></div>' + tagesverlauf(fa, B) + '</div>';
  // Behänge je Fassade
  fassaden.forEach(function (f) {
    var liste = geraete.filter(function (g) { return g.fassade === f.kennung; });
    o += '<div class="gruppe"><div class="titel">' + esc(f.name || f.kennung) + ' · ' + Math.round(f.az) + '°<span class="rechts">' + esc(f.sonne ? T('sun now') : (f.verdeckt ? T('hidden by the surroundings') : '')) + '</span></div><div class="raster">';
    liste.forEach(function (g) {
      var st = g.zu == null ? '' : (g.typ === 'markise' ? (g.zu > .05 ? T('extended') + ' ' + Math.round(g.zu * 100) + ' %' : T('retracted')) : (g.zu < .03 ? T('open') : Math.round(g.zu * 100) + ' % ' + T('closed'))) + (g.lamelle != null && g.typ === 'raffstore' && g.zu > .03 ? ' · ' + g.lamelle + '°' : '');
      o += '<div class="geraet' + (gewaehlt === g._i ? ' gewaehlt' : '') + (g.aktiv === false ? ' aus' : '') + '" data-i="' + g._i + '"><div class="k">' + symbol(g)
        + '<span class="n">' + esc(g.name) + '</span><button class="toggle klein' + (g.aktiv === false ? '' : ' an') + '" data-s="' + g._i + '"' + (daten.bedienbar ? '' : ' disabled') + ' title="' + esc(T('Automatic')) + '"></button></div>'
        + '<div class="s">' + esc(st) + '</div><div class="g">' + esc(g.grund) + '</div>' + (g.stoerung ? '<div class="g" style="color:var(--warn)">⚠ ' + esc(g.stoerung) + '</div>' : '') + '<div class="m">'
        + (g.raumTemp != null ? '<span class="zahl">' + zahl(g.raumTemp, 1) + ' °C</span>' : '') + (g.raumLux != null ? '<span class="zahl">' + zahl(g.raumLux) + ' lx' + (g.zielLux ? ' → ' + g.zielLux : '') + '</span>' : '') + (g.waerme > 50 ? '<span class="zahl" title="' + esc(T('Solar heat today')) + '">☀︎ ' + kwh(g.waerme) + ' kWh</span>' : '') + (g.fahrten ? '<span class="zahl" title="' + esc(T('moves today')) + '">↕ ' + g.fahrten + '</span>' : '') + '</div></div>';
      if (gewaehlt === g._i && (g.weg || []).length) { o += '<div class="weg">' + esc(g.weg.join('\n')) + '</div>'; }
    });
    o += '</div></div>';
  });
  if (!fassaden.length) { o += '<div class="karte">' + esc(T('No device assigned')) + '</div>'; }
  if (daten.regeln) { o += '<button class="infoknopf" id="info">ⓘ ' + esc(T('How the automatic works')) + (infoOffen ? ' ▴' : ' ▾') + '</button>' + (infoOffen ? '<div class="info">' + esc(daten.regeln) + '</div>' : ''); }
  k.innerHTML = o;
  var b = document.getElementById('auto'); if (b) { b.onclick = function () { aktion('Automatik', !daten.automatik); }; }
  var nb = document.getElementById('nachbarn'); if (nb) { nb.onclick = function () { nachbarnAn = !nachbarnAn; try { localStorage.setItem('vsch-nachbarn', nachbarnAn ? '1' : '0'); } catch (e) { } zeichnen(); }; }
  var ib = document.getElementById('info'); if (ib) { ib.onclick = function () { infoOffen = !infoOffen; zeichnen(); }; }
  Array.prototype.forEach.call(k.querySelectorAll('.geraet'), function (e) { e.onclick = function () { var i = +e.getAttribute('data-i'); gewaehlt = gewaehlt === i ? null : i; var g = daten.geraete[i]; if (g) { fassadeWahl = g.fassade; } zeichnen(); }; });
  Array.prototype.forEach.call(k.querySelectorAll('[data-s]'), function (e) { e.onclick = function (ev) { ev.stopPropagation(); var g = daten.geraete[+e.getAttribute('data-s')]; if (g) { aktion(g.schalter, !g.aktiv); } }; });
}

// Hintergrund für IPSView: auf die ganze Seite, Schriftfarbe nach Helligkeit; ohne Angabe nach Gerätemodus
function hintergrund(bg) {
  if (!bg && typeof requestAction !== 'function') { bg = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#1c1c1e' : '#f2f2f7'; }
  if (!bg) { return; }
  document.documentElement.style.background = bg; document.body.style.background = bg;
  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(bg);
  if (m) { document.body.className = (.299 * parseInt(m[1], 16) + .587 * parseInt(m[2], 16) + .114 * parseInt(m[3], 16)) < 140 ? 'dunkel' : 'hell'; }
}

function handleMessage(nachricht) {
  var neu = typeof nachricht === 'string' ? JSON.parse(nachricht) : nachricht;
  if (!neu) { return; }
  var texte = daten && daten.texte, regeln = daten && daten.regeln;
  daten = neu;
  if (!daten.texte && texte) { daten.texte = texte; }
  if (!daten.regeln && regeln) { daten.regeln = regeln; }
  hintergrund(daten.bg);
  zeichnen();
}
var groesse = 0;
window.addEventListener('resize', function () { clearTimeout(groesse); groesse = setTimeout(zeichnen, 150); });
</script>
