<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kachel der Verschattung (HTML-SDK) und zugleich die eigenständige Seite für IPSView (WebHook).
     Daten kommen über handleMessage: beim Aufbau mit Texten (GetVisualizationTile), danach nur noch Werte
     (UpdateVisualizationValue bzw. Abruf ?json=1 auf der IPSView-Seite). Bedienung nur: Automatik an/aus. -->
<style>
:root{--fg:#1d1d1f;--fg2:#6e6e73;--rand:rgba(0,0,0,.12);--fl:rgba(0,0,0,.05);--sonne:#f5a623;--sonnebg:rgba(245,166,35,.16);
  --behang:#8a6d4b;--kuehl:#2f80ed;--heiz:#e2574c;--neutral:#8e8e93;--haus:#c7c7cc;--nachbar:#d9d9de;--erde:#c9cfc4;--geb:#8e968a}
@media (prefers-color-scheme:dark){:root{--fg:#f2f2f7;--fg2:#a1a1a6;--rand:rgba(255,255,255,.16);--fl:rgba(255,255,255,.07);
  --haus:#636366;--nachbar:#48484a;--erde:#5b6157;--geb:#7d8579}}
body.hell{--fg:#1d1d1f;--fg2:#6e6e73;--rand:rgba(0,0,0,.12);--fl:rgba(0,0,0,.05);--haus:#c7c7cc;--nachbar:#d9d9de;--erde:#c9cfc4;--geb:#8e968a}
body.dunkel{--fg:#f2f2f7;--fg2:#a1a1a6;--rand:rgba(255,255,255,.16);--fl:rgba(255,255,255,.07);--haus:#636366;--nachbar:#48484a;--erde:#5b6157;--geb:#7d8579}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{box-sizing:border-box;padding:var(--margin-top,14px) var(--margin-side,14px) var(--margin-bottom,14px)}
.kachel{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wert{display:flex;flex-direction:column;min-width:64px}
.wert b{font-size:17px;font-weight:600}
.wert span{font-size:11px;color:var(--fg2)}
.lage{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--fl)}
.lage.kuehlen{color:var(--kuehl);background:rgba(47,128,237,.14)}
.lage.heizen{color:var(--heiz);background:rgba(226,87,76,.14)}
.schalter{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2)}
.schalter button{font:inherit;font-size:13px;color:var(--fg);background:var(--fl);border:1px solid var(--rand);border-radius:14px;padding:4px 12px;cursor:pointer}
.schalter button.an{background:var(--sonnebg);border-color:transparent;color:#b26a00}
.schalter button:disabled{opacity:.5;cursor:default}
.hinweis{font-size:12px;padding:6px 10px;border-radius:10px;background:rgba(226,87,76,.14);color:var(--heiz)}
.bilder{display:flex;gap:10px;flex-wrap:wrap}
.bild{flex:1 1 240px;min-width:200px;max-width:420px;border-radius:12px;overflow:hidden;background:var(--fl)}
.bild svg{display:block;width:100%;height:auto;max-height:210px}
.bild.plan svg{margin:0 auto;max-width:280px}
.liste{display:flex;flex-direction:column;gap:4px}
.zeile{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--fl);cursor:pointer}
.zeile .sym{flex:none;width:26px;height:30px}
.zeile .name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .grund{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .txt{min-width:0;flex:1}
.zeile .prozent{flex:none;font-size:13px;color:var(--fg2)}
.weg{display:none;font-size:12px;color:var(--fg2);padding:2px 10px 8px 44px;white-space:pre-line}
.zeile.offen + .weg{display:block}
.leer{font-size:13px;color:var(--fg2)}
</style>
</head>
<body>
<div class="kachel" id="kachel"></div>
<script>
var daten = null;
var offen = {};

function T(k) { return (daten && daten.texte && daten.texte[k]) || k; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function zahl(v, n) { return v == null ? '–' : Number(v).toLocaleString(undefined, {maximumFractionDigits: n || 0}); }

// Kachel: requestAction an die Instanz. IPSView-Seite: keine Bedienung.
function automatik() {
  if (typeof requestAction === 'function' && daten) { requestAction('Automatik', !daten.automatik); }
}

// Himmel je Zustand: Farbverlauf, Wolken, Regen, Sterne
var HIMMEL = {
  sonnig: ['#4a90e2', '#bfe1ff'], heiter: ['#5b9bd5', '#d6e9f8'], wolkig: ['#8aa4bd', '#dfe7ee'],
  bedeckt: ['#8c949c', '#c9ced3'], regen: ['#6b7580', '#a9b1b9'], daemmerung: ['#3b4a6b', '#f2b880'],
  nacht: ['#0f1a33', '#2a3b5f'], unbekannt: ['#9fb6cc', '#e4edf5']
};

function wolke(x, y, s, o) {
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')" opacity="' + o + '">'
    + '<ellipse cx="0" cy="0" rx="22" ry="11" fill="#fff"/><ellipse cx="-12" cy="-6" rx="12" ry="10" fill="#fff"/>'
    + '<ellipse cx="9" cy="-9" rx="14" ry="12" fill="#fff"/></g>';
}

// Himmelsbogen: Azimut 60–300° waagerecht, Höhe 0–70° senkrecht
function himmelsbogen() {
  var W = 320, H = 170, ml = 6, mr = 6, mt = 8, mb = 18, a0 = 50, a1 = 310, h1 = 70;
  function x(a) { return ml + (a - a0) / (a1 - a0) * (W - ml - mr); }
  function y(h) { return H - mb - Math.max(0, h) / h1 * (H - mt - mb); }
  var k = daten.himmel || {art: 'unbekannt'}, f = HIMMEL[k.art] || HIMMEL.unbekannt, o = '';
  o += '<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + f[0] + '"/><stop offset="1" stop-color="' + f[1] + '"/></linearGradient></defs>';
  o += '<rect width="' + W + '" height="' + H + '" fill="url(#hg)"/>';
  if (k.art === 'nacht') {
    for (var i = 0; i < 18; i++) { o += '<circle cx="' + ((i * 53) % W) + '" cy="' + (8 + (i * 37) % 90) + '" r="' + (i % 3 ? .8 : 1.3) + '" fill="#fff" opacity=".8"/>'; }
  }
  if (k.art === 'heiter') { o += wolke(70, 40, .8, .85) + wolke(250, 28, .6, .8); }
  if (k.art === 'wolkig') { o += wolke(60, 36, 1, .9) + wolke(160, 26, 1.2, .9) + wolke(262, 44, .9, .9); }
  if (k.art === 'bedeckt' || k.art === 'regen') { o += wolke(50, 30, 1.4, .85) + wolke(150, 22, 1.6, .9) + wolke(255, 30, 1.4, .85); }
  if (k.art === 'regen') {
    for (var r = 0; r < 26; r++) { var rx = 10 + r * 12; o += '<line x1="' + rx + '" y1="' + (52 + (r % 4) * 9) + '" x2="' + (rx - 4) + '" y2="' + (62 + (r % 4) * 9) + '" stroke="#e8eef4" stroke-width="1.3" opacity=".8"/>'; }
  }
  // Band der Hauptfassade (±80°)
  if (daten.fassadeAz != null) {
    var b0 = Math.max(a0, daten.fassadeAz - 80), b1 = Math.min(a1, daten.fassadeAz + 80);
    o += '<rect x="' + x(b0) + '" y="' + mt + '" width="' + (x(b1) - x(b0)) + '" height="' + (H - mt - mb) + '" fill="#fff" opacity=".13"/>';
  }
  // Gelände-Horizont und Nachbargebäude
  var d = 'M' + x(a0) + ',' + y(0);
  (daten.horizont || []).forEach(function (p) { if (p[0] >= a0 && p[0] <= a1) { d += ' L' + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); } });
  o += '<path d="' + d + ' L' + x(a1) + ',' + y(0) + 'Z" fill="var(--erde)" opacity=".95"/>';
  (daten.gebaeude || []).forEach(function (p) {
    if (p[0] >= a0 && p[0] <= a1) { o += '<rect x="' + (x(p[0] - 1)).toFixed(1) + '" y="' + y(p[1]).toFixed(1) + '" width="' + (x(p[0] + 1) - x(p[0] - 1) + .4).toFixed(1) + '" height="' + (y(0) - y(p[1])).toFixed(1) + '" fill="var(--geb)"/>'; }
  });
  // Sonnenbahn heute, Sonnenzeit auf der Fassade kräftig
  var pfad = '', pfadAn = '';
  (daten.bahn || []).forEach(function (p, i) {
    var s = (i ? ' L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1);
    pfad += s;
  });
  if (pfad) { o += '<path d="' + pfad + '" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" opacity=".9"/>'; }
  (daten.bahnAn || []).forEach(function (seg) {
    var s = ''; seg.forEach(function (p, i) { s += (i ? ' L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); });
    o += '<path d="' + s + '" fill="none" stroke="var(--sonne)" stroke-width="3" stroke-linecap="round"/>';
  });
  // Sonne jetzt
  if (daten.sonne && daten.sonne.alt > -1 && daten.sonne.az >= a0 && daten.sonne.az <= a1) {
    var sx = x(daten.sonne.az), sy = y(daten.sonne.alt), tr = (k.art === 'bedeckt' || k.art === 'regen') ? .55 : 1;
    o += '<circle cx="' + sx + '" cy="' + sy + '" r="13" fill="#ffd25a" opacity="' + (.35 * tr) + '"/><circle cx="' + sx + '" cy="' + sy + '" r="7.5" fill="#ffcc33" opacity="' + tr + '"/>';
  }
  [[90, 'E'], [135, 'SE'], [180, 'S'], [225, 'SW'], [270, 'W']].forEach(function (t) {
    o += '<text x="' + x(t[0]) + '" y="' + (H - 5) + '" font-size="10" text-anchor="middle" fill="var(--fg2)">' + T(t[1]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '">' + o + '</svg>';
}

// Haus von oben: Norden oben, beschienene Fassaden in Sonnenfarbe, Sonne am Rand in ihrer Richtung
function grundriss() {
  var W = 220, H = 170, cx = W / 2, cy = H / 2, o = '';
  var pts = [].concat(daten.haus || []);
  (daten.nachbarn || []).forEach(function (n) { pts = pts.concat(n); });
  var r = 12;
  pts.forEach(function (p) { r = Math.max(r, Math.abs(p[0]), Math.abs(p[1])); });
  r = Math.min(r, 40);
  var m = (Math.min(W, H) / 2 - 26) / r;
  function P(p) { return (cx + p[0] * m).toFixed(1) + ',' + (cy - p[1] * m).toFixed(1); }
  function poly(ps) { return ps.map(P).join(' '); }
  (daten.nachbarn || []).forEach(function (n) {
    if (n.some(function (p) { return Math.abs(p[0]) <= r && Math.abs(p[1]) <= r; })) { o += '<polygon points="' + poly(n) + '" fill="var(--nachbar)"/>'; }
  });
  if ((daten.haus || []).length) { o += '<polygon points="' + poly(daten.haus) + '" fill="var(--haus)"/>'; }
  else { o += '<rect x="' + (cx - 26) + '" y="' + (cy - 20) + '" width="52" height="40" rx="3" fill="var(--haus)"/>'; }
  (daten.fassaden || []).forEach(function (f) {
    if (!f.aktiv) { return; }
    var farbe = f.sonne ? 'var(--sonne)' : 'var(--fg2)', breite = f.sonne ? 5 : 2.5;
    if (f.seg && f.seg.length) {
      f.seg.forEach(function (s) { o += '<line x1="' + (cx + s[0][0] * m) + '" y1="' + (cy - s[0][1] * m) + '" x2="' + (cx + s[1][0] * m) + '" y2="' + (cy - s[1][1] * m) + '" stroke="' + farbe + '" stroke-width="' + breite + '" stroke-linecap="round"/>'; });
    } else {
      var a = f.az * Math.PI / 180, fx = cx + Math.sin(a) * 30, fy = cy - Math.cos(a) * 24;
      o += '<line x1="' + (fx - Math.cos(a) * 18) + '" y1="' + (fy - Math.sin(a) * 18) + '" x2="' + (fx + Math.cos(a) * 18) + '" y2="' + (fy + Math.sin(a) * 18) + '" stroke="' + farbe + '" stroke-width="' + breite + '" stroke-linecap="round"/>';
    }
  });
  o += '<text x="' + (W - 12) + '" y="16" font-size="11" text-anchor="middle" fill="var(--fg2)">N</text><path d="M' + (W - 12) + ',20 l-4,9 l4,-3 l4,3z" fill="var(--fg2)"/>';
  if (daten.sonne && daten.sonne.alt > -1) {
    var sa = daten.sonne.az * Math.PI / 180, rr = Math.min(W, H) / 2 - 14, sx = cx + Math.sin(sa) * rr, sy = cy - Math.cos(sa) * rr;
    o += '<line x1="' + sx + '" y1="' + sy + '" x2="' + (cx + Math.sin(sa) * 30) + '" y2="' + (cy - Math.cos(sa) * 30) + '" stroke="var(--sonne)" stroke-width="1.2" stroke-dasharray="2 3" opacity=".8"/>';
    o += '<circle cx="' + sx + '" cy="' + sy + '" r="8" fill="#ffcc33"/>';
    for (var i = 0; i < 8; i++) { var w = i * Math.PI / 4; o += '<line x1="' + (sx + Math.cos(w) * 10) + '" y1="' + (sy + Math.sin(w) * 10) + '" x2="' + (sx + Math.cos(w) * 13) + '" y2="' + (sy + Math.sin(w) * 13) + '" stroke="#ffcc33" stroke-width="1.6" stroke-linecap="round"/>'; }
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '">' + o + '</svg>';
}

// Symbol eines Behangs: Fensterrahmen, Behang so weit unten wie seine Stellung, Lamellen schräg
function symbol(g) {
  var z = Math.max(0, Math.min(1, g.zu == null ? 0 : g.zu)), h = 4 + z * 22, o = '<rect x="2" y="3" width="22" height="26" rx="2" fill="none" stroke="var(--fg2)" stroke-width="1.3"/>';
  if (g.typ === 'markise') {
    o = '<line x1="3" y1="5" x2="23" y2="5" stroke="var(--fg2)" stroke-width="2"/><path d="M3,5 L' + (3 + z * 4) + ',' + (5 + z * 20) + ' L' + (23 + z * 0) + ',' + (5 + z * 20) + ' L23,5z" fill="var(--sonne)" opacity="' + (.25 + z * .55) + '"/>';
  } else if (g.typ === 'raffstore' && g.lamelle != null) {
    var w = (g.lamelle || 0) * Math.PI / 180;
    for (var yy = 5.5; yy < 3 + h; yy += 3.4) { o += '<line x1="' + (13 - 9 * Math.cos(w)) + '" y1="' + (yy - 1.6 * Math.sin(w)) + '" x2="' + (13 + 9 * Math.cos(w)) + '" y2="' + (yy + 1.6 * Math.sin(w)) + '" stroke="var(--behang)" stroke-width="1.8" stroke-linecap="round"/>'; }
  } else {
    o += '<rect x="3.5" y="4" width="19" height="' + (h - 1).toFixed(1) + '" fill="var(--behang)"/>';
    for (var ry = 7; ry < 3 + h - 1; ry += 3.5) { o += '<line x1="4" y1="' + ry + '" x2="22" y2="' + ry + '" stroke="var(--rand)" stroke-width=".8"/>'; }
  }
  return '<svg class="sym" viewBox="0 0 26 32">' + o + '</svg>';
}

function zeichnen() {
  var k = document.getElementById('kachel');
  if (!daten) { return; }
  var lage = daten.lage || '', o = '';
  o += '<div class="kopf">';
  o += '<div class="wert"><b>' + zahl(daten.einstrahlung) + ' W/m²</b><span>' + esc(T(daten.himmel ? daten.himmel.text : 'Irradiance')) + '</span></div>';
  if (daten.aussen != null) { o += '<div class="wert"><b>' + zahl(daten.aussen, 1) + ' °C</b><span>' + esc(T('outside')) + '</span></div>'; }
  if (lage) { o += '<span class="lage ' + esc(lage) + '">' + esc(daten.lageText || '') + '</span>'; }
  o += '<div class="schalter">' + esc(T('Automatic')) + '<button id="auto" class="' + (daten.automatik ? 'an' : '') + '"' + (daten.bedienbar ? '' : ' disabled') + '>' + esc(daten.automatik ? T('on') : T('off')) + '</button></div>';
  o += '</div>';
  if (daten.sperre) { o += '<div class="hinweis">' + esc(daten.sperre) + '</div>'; }
  o += '<div class="bilder"><div class="bild plan">' + grundriss() + '</div><div class="bild">' + himmelsbogen() + '</div></div>';
  if (daten.sonnenzeit) { o += '<div class="leer">☀️ ' + esc(daten.sonnenzeit) + '</div>'; }
  o += '<div class="liste">';
  if (!(daten.geraete || []).length) { o += '<div class="leer">' + esc(T('No device assigned')) + '</div>'; }
  (daten.geraete || []).forEach(function (g, i) {
    o += '<div class="zeile' + (offen[i] ? ' offen' : '') + '" data-i="' + i + '">' + symbol(g)
      + '<div class="txt"><div class="name">' + esc(g.name) + '</div><div class="grund">' + esc(g.grund) + '</div></div>'
      + '<div class="prozent">' + (g.zu == null ? '' : Math.round(g.zu * 100) + ' %') + '</div></div>'
      + '<div class="weg">' + esc((g.weg || []).join('\n')) + '</div>';
  });
  o += '</div>';
  k.innerHTML = o;
  var b = document.getElementById('auto');
  if (b) { b.onclick = automatik; }
  Array.prototype.forEach.call(k.querySelectorAll('.zeile'), function (z) {
    z.onclick = function () { var i = z.getAttribute('data-i'); offen[i] = !offen[i]; zeichnen(); };
  });
}

// Hintergrund für IPSView: auf die ganze Seite, Schriftfarbe nach Helligkeit (Verbund-Merkregel)
function hintergrund(bg) {
  if (!bg && typeof requestAction !== 'function') {
    // eigenständige Seite ohne ?bg: lesbarer Grund nach Gerätemodus (in der Kachel liefert Symcon den Hintergrund)
    bg = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#1c1c1e' : '#ffffff';
  }
  if (!bg) { return; }
  document.documentElement.style.background = bg;
  document.body.style.background = bg;
  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(bg);
  if (m) {
    var l = .299 * parseInt(m[1], 16) + .587 * parseInt(m[2], 16) + .114 * parseInt(m[3], 16);
    document.body.className = l < 140 ? 'dunkel' : 'hell';
  }
}

function handleMessage(nachricht) {
  var neu = typeof nachricht === 'string' ? JSON.parse(nachricht) : nachricht;
  if (!neu) { return; }
  var texte = daten && daten.texte;
  daten = neu;
  if (!daten.texte && texte) { daten.texte = texte; }
  hintergrund(daten.bg);
  zeichnen();
}
</script>
</body>
</html>
